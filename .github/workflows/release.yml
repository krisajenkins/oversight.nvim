name: Release

# Cut a GitHub release whenever a version tag is pushed. Tag the commit you want
# to release and push the tag; release notes are generated from the commits
# since the previous tag.
#
#     jj tag set v0.1.0 -r @-      # writes a real git tag in this colocated repo
#     git push origin v0.1.0       # `jj git push` does not push tags
#
# A bookmark is not a tag — pushing one named `v0.1.0` creates a branch, which
# will not trigger this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `--verify-tag` refuses to publish if the ref isn't an existing tag, so a
      # mistyped or deleted tag fails loudly rather than creating a release
      # pointing at nothing.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
